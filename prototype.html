        /* Custom Animations & Styles */
        body {
            background-color: #080808; /* Level 0 Void */
            color: #e5e2e1;
            overflow-x: hidden;
        }

        /* Particle System */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1; /* Behind grid, above shader */
            pointer-events: none;
        }

        /* Border Pulse Animation */
        @keyframes borderPulse {
            0% { border-color: #ffb800; box-shadow: 0 0 10px rgba(255, 184, 0, 0.5); }
            50% { border-color: #ff0df5; box-shadow: 0 0 20px rgba(255, 13, 245, 0.8); }
            100% { border-color: #ffb800; box-shadow: 0 0 10px rgba(255, 184, 0, 0.5); }
        }
        .animate-border-pulse {
            animation: borderPulse 4s infinite alternate;
        }

        /* Shimmering Gradient CTA */
        @keyframes shimmerGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .btn-shimmer {
            background: linear-gradient(270deg, #ffb800, #ff0df5, #00d9e7);
            background-size: 600% 600%;
            animation: shimmerGradient 4s ease infinite;
            transition: all 0.3s ease;
        }
        .btn-shimmer:hover {
            box-shadow: 0 0 20px rgba(255, 184, 0, 0.8);
            transform: scale(1.02);
        }

        /* Dot Pulse */
        @keyframes dotPulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 240, 255, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
        }
        .animate-pulse-cyan {
            animation: dotPulse 2s infinite;
        }

        /* Entrance Animations */
        .slide-up {
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpAnim 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUpAnim {
            to { opacity: 1; transform: translateY(0); }
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }

        /* Grid Item Hover */
        .grid-slot {
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }
        .grid-slot::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .grid-slot:hover {
            transform: scale(1.05);
            z-index: 10;
        }
        .grid-slot:hover::after {
            border-color: #00d9e7;
            box-shadow: inset 0 0 15px rgba(0, 217, 231, 0.3);
        }

<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_8');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

// Multi-color Nuclear Sunset Palette
vec3 color1 = vec3(1.0, 0.72, 0.0);    // Amber #FFB800
vec3 color2 = vec3(1.0, 0.0, 0.96);    // Magenta #FF00F5
vec3 color3 = vec3(0.0, 0.94, 1.0);    // Cyan #00F0FF
vec3 bg = vec3(0.03, 0.03, 0.03);      // Dark Base

void main() {
    vec2 uv = v_texCoord;
    vec2 p = uv * 2.0 - 1.0;
    p.x *= u_resolution.x / u_resolution.y;

    // Moving noise/liquid effect
    float noise = sin(p.x * 2.0 + u_time) * cos(p.y * 2.0 + u_time * 0.5);
    noise += sin(p.y * 3.0 - u_time * 0.8) * cos(p.x * 1.5 + u_time);
    
    // Gradient layers
    float g1 = smoothstep(-1.0, 1.0, sin(uv.x * 3.0 + u_time * 0.5) + noise);
    float g2 = smoothstep(-1.0, 1.0, cos(uv.y * 2.0 - u_time * 0.7) + noise);
    float g3 = smoothstep(-0.5, 0.5, sin(length(p) - u_time));

    vec3 finalColor = mix(bg, color1, g1 * 0.3);
    finalColor = mix(finalColor, color2, g2 * 0.2);
    finalColor = mix(finalColor, color3, g3 * 0.1);

    // Scanline effect
    float scanline = sin(uv.y * 200.0 + u_time * 10.0) * 0.02;
    finalColor += scanline;

    // Grid dots
    vec2 grid = fract(uv * 30.0);
    float dots = smoothstep(0.1, 0.05, length(grid - 0.5));
    finalColor += dots * 0.05 * color1;

    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
