# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy DripRig to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Python dependencies & verify
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          echo "✅ Python deps installed successfully"

      # ── Node / Vite Frontend Build ──────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Vite frontend → backend/static/
        run: npm run build
        working-directory: frontend

      - name: Verify frontend build output
        run: |
          if [ -d "backend/static" ] && [ "$(ls -A backend/static)" ]; then
            echo "✅ Frontend build present in backend/static/"
            ls -la backend/static/
          else
            echo "❌ Frontend build missing — aborting"
            exit 1
          fi

      # ── Package Artifact ────────────────────────────────────────────────────
      # Exclude heavy dirs. Azure/Oryx re-installs Python deps on the server.
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !frontend/node_modules/
            !backend/.venv/
            !backend/__pycache__/
            !backend/**/__pycache__/
            !.git/
            !.github/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C866FC71E3D64FAAAD4B396D5DB523AA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BE366A0D6ED44503BF3F70D811C09569 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8D1A4F72528145968522164411A4AE9E }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'driprig'
          slot-name: 'Production'
          startup-command: 'gunicorn -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 600 --access-logfile - --error-logfile - app:app'