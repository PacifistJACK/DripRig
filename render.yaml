# Render Blueprint deployment definition for DripRig
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: driprig
    env: python
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .. && cp -r frontend/dist/* backend/static/"
    startCommand: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 600 app:app"
    envVars:
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL
        value: "600"
      - key: PYTHON_VERSION
        value: "3.11.0"
